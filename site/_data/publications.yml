- id: prkv
  title: "PRKV: Page Restructed KV Cache for High Accuracy and Efficiency LLM Generation"
  year: 2026
  venue: EMNLP 2026
  authors:
    - name: Fang Wu
      self: true
    - name: Congming Gao
    - name: Weixi Zhu
    - name: Jiwu Shu
  topics:
    - KV Cache
    - Sparse Attention
    - Efficient LLMs
  anthology: https://aclanthology.org/2026.emnlp-main.100/
  pdf: https://aclanthology.org/2026.emnlp-main.100.pdf
  summary: >-
    PRKV improves long-context LLM generation through page-level KV retrieval with
    CPU offloading. It combines static and dynamic KV selection to improve retrieval
    accuracy, while contiguous memory indexing and batched transfers reduce retrieval
    overhead. Across the evaluated models and scenarios, the method improves accuracy
    and reports up to a 6.75× speedup over state-of-the-art KV retrieval methods.
  bibtex: |
    @inproceedings{wu-etal-2026-prkv,
      title = {{PRKV}: Page Restructed {KV} Cache for High Accuracy and Efficiency {LLM} Generation},
      author = {Wu, Fang and Gao, Congming and Zhu, Weixi and Shu, Jiwu},
      booktitle = {Proceedings of the 2026 Conference on Empirical Methods in Natural Language Processing},
      month = oct,
      year = {2026},
      address = {Budapest, Hungary},
      publisher = {Association for Computational Linguistics},
      pages = {2355--2377},
      url = {https://aclanthology.org/2026.emnlp-main.100/}
    }

- id: anchorattention
  title: "AnchorAttention: Difference-Aware Sparse Attention with Stripe Granularity"
  year: 2025
  venue: EMNLP 2025
  authors:
    - name: Yu Zhang
    - name: Dong Guo
    - name: Fang Wu
      self: true
    - name: Guoliang Zhu
    - name: Dian Ding
    - name: Yiming Zhang
  topics:
    - Sparse Attention
    - Efficient LLMs
  arxiv: https://arxiv.org/abs/2505.23520
  anthology: https://aclanthology.org/2025.emnlp-main.430/
  pdf: https://aclanthology.org/2025.emnlp-main.430.pdf
  summary: >-
    AnchorAttention accelerates long-context LLM prefill with dynamically selected,
    stripe-shaped attention regions. It uses an anchor derived from shared attention
    patterns to identify important positions, then computes attention through discrete
    key-value loading. This finer granularity improves sparsity while retaining useful
    attention information. At a context length of 128k tokens, the method reports a
    1.44× speedup over earlier leading approaches, together with higher recall.
  bibtex: |
    @inproceedings{zhang-etal-2025-anchorattention,
      title = {AnchorAttention: Difference-Aware Sparse Attention with Stripe Granularity},
      author = {Zhang, Yu and Guo, Dong and Wu, Fang and Zhu, Guoliang and Ding, Dian and Zhang, Yiming},
      booktitle = {Proceedings of the 2025 Conference on Empirical Methods in Natural Language Processing},
      year = {2025},
      pages = {8537--8549},
      doi = {10.18653/v1/2025.emnlp-main.430},
      url = {https://aclanthology.org/2025.emnlp-main.430/}
    }
